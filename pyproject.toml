[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esbm"
version = "1.4.0"
description = "Observation-conditioned decision criteria for bifunctional enzyme systems"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yule Choi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "sympy>=1.12", "mpmath>=1.3", "matplotlib>=3.7", "openpyxl>=3.1", "pandas>=2.0"]

[project.optional-dependencies]
publication = ["pypdf>=5", "Pillow>=10"]

[tool.setuptools]
packages = ["esbm"]
